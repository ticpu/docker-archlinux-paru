name: Build and Push Docker Image

permissions:
  contents: read
  packages: write

on:
  schedule:
  - cron: '17 3 * * 2'
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Docker Hub search ranks an exact name match first, hence the paru name
    # beside archlinux-paru, which keeps the existing pulls.
    # The timestamp tag is unique per run, so no build is left untagged, and
    # retention can find old builds by tag.
    - name: Image names and tags
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ghcr.io/${{ github.repository }}
          ${{ secrets.DOCKERHUB_USERNAME }}/archlinux-paru
          ${{ secrets.DOCKERHUB_USERNAME }}/paru
        tags: |
          type=raw,value=latest
          type=raw,value={{date 'YYYYMMDD-HHmmss'}}

    # One build pushed to every registry, so they always carry the same image.
    # A pull request builds without pushing: :latest is what master built.
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        build-args: |
          REGISTRY=ghcr.io/archlinux
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    # README.md is the Docker Hub description of both repositories.
    - name: Update Docker Hub description of paru
      if: github.event_name != 'pull_request'
      uses: peter-evans/dockerhub-description@v5
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: ${{ secrets.DOCKERHUB_USERNAME }}/paru
        short-description: Arch Linux with the paru AUR helper, Rust and cargo pre-installed. amd64 and arm64, rebuilt weekly.

    - name: Update Docker Hub description of archlinux-paru
      if: github.event_name != 'pull_request'
      uses: peter-evans/dockerhub-description@v5
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: ${{ secrets.DOCKERHUB_USERNAME }}/archlinux-paru
        short-description: Arch Linux with the paru AUR helper, Rust and cargo pre-installed. amd64 and arm64, rebuilt weekly.
