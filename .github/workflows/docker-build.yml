# Builds Arch Linux with paru for amd64 and arm64 and publishes one image as
# ghcr.io/ticpu/docker-archlinux-paru, docker.io/ticpu/archlinux-paru and
# docker.io/ticpu/paru, tagged latest and YYYYMMDD-HHMMSS (UTC build time).
#
# - Docker's reusable builder runs each platform on its own native runner
#   (arm64 on ubuntu-*-arm, no QEMU) and merges them into one index pushed to
#   every name, so all registries always carry the same image.
# - paru beside archlinux-paru: Docker Hub search ranks an exact name match
#   first, and archlinux-paru keeps the existing pulls.
# - The timestamp tag is unique per run. Registries document listing tags,
#   not untagged manifests, so it is how retention finds every build, and a
#   date alone would let two runs on one day orphan the first.
# - Signing stays off: the Docker Hub cleanup does not delete referrers.
# - A pull request builds without pushing: latest is what master built.
# - Cleanup runs only after a successful build, so a broken build never
#   leaves a registry without a recent image. Retention is 180 days in both
#   steps, since ghcr-cleanup-action reads "6 months" as 180 days and GNU
#   date as calendar months. It deletes a multi-arch image together with its
#   platform children and attestations: GHCR lists those as separate untagged
#   versions, and deleting untagged versions alone would break live images.
name: Build and Push Docker Image

permissions:
  contents: read

on:
  schedule:
  - cron: '17 3 * * 2'
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      build-args: |
        REGISTRY=ghcr.io/archlinux
      sign: false
      meta-images: |
        ghcr.io/${{ github.repository }}
        docker.io/ticpu/archlinux-paru
        docker.io/ticpu/paru
      meta-tags: |
        type=raw,value=latest
        type=raw,value={{date 'YYYYMMDD-HHmmss'}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  # README.md is the Docker Hub description of both repositories.
  descriptions:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Update Docker Hub description of paru
      uses: peter-evans/dockerhub-description@v5
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: ${{ secrets.DOCKERHUB_USERNAME }}/paru
        short-description: Arch Linux with the paru AUR helper, Rust and cargo pre-installed. amd64 and arm64, rebuilt weekly.

    - name: Update Docker Hub description of archlinux-paru
      uses: peter-evans/dockerhub-description@v5
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: ${{ secrets.DOCKERHUB_USERNAME }}/archlinux-paru
        short-description: Arch Linux with the paru AUR helper, Rust and cargo pre-installed. amd64 and arm64, rebuilt weekly.

  cleanup:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: registry-cleanup
    permissions:
      packages: write

    steps:
    - name: Delete GHCR images older than six months
      uses: dataaxiom/ghcr-cleanup-action@v1
      with:
        older-than: 180 days
        delete-untagged: true
        delete-tags: '^[0-9]{8}-[0-9]{6}$'
        use-regex: true
        exclude-tags: latest
        validate: true

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Delete Docker Hub images older than six months
      run: scripts/dockerhub-cleanup.sh archlinux-paru paru
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        RETENTION: 180 days
